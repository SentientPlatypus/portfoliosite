name: Build and deploy

on:
  push:
    branches: [main]
  # Refreshes the Spotify / Clash Royale snapshots on a schedule.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Only the newest run matters; cancel superseded ones.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Refresh credentialed stat snapshots
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          CLASH_ROYALE_TOKEN: ${{ secrets.CLASH_ROYALE_TOKEN }}
        run: node scripts/refresh-stats.mjs

      - run: npm run build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
